name: Keep Streamlit App Awake

on:
  schedule:
    # Runs every 4 hours (adjust cron if you want it more/less frequent)
    - cron: '0 */4 * * *'
  workflow_dispatch: # Allows you to manually run it anytime from GitHub to test

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install playwright
        playwright install chromium

    - name: Run Wake Up Script
      run: python ping_app.py